<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ledge</title>
</head>

<body>


    <div class="container">
        <!-- Sidebar -->
        <div id="sidebar"></div>
        <!-- Main Content -->
        <main>
            <header>
                <div class="header-content">
                    <h2>October Overview</h2>
                    <p>Tuesday, 27 October</p>
                </div>
                <button class="add-button">Add expenses</button>
            </header>
            <!-- Total Content -->
            <section class="total-content">
                <div class="spent-today-tab">
                    <h4>Spent today</h4>
                    <p>NT$ 215</p>
                </div>
                <div class="income-tab">
                    <h4>Income this month</h4>
                    <p>NT$ 48,000</p>
                </div>
                <div class="spent-month-tab">
                    <h4>Spent this month</h4>
                    <p>NT$ 21,340</p>
                </div>
                <div class="net-month-tab">
                    <h4>Net this month</h4>
                    <p>NT$ 26,660</p>
                </div>
            </section>
            <!-- Chart Content -->
            <section class="chart-content">
                <div class="chart-graph">
                    <div class="graph-header">
                        <h4>Daily spending</h4>
                        <p>Last 14 days</p>
                    </div>
                    <div class="graph-body">

                    </div>
                </div>
                <div class="chart-bar">
                    <p>Top categories</p>
                    <div class="bar-content">
                    </div>
                </div>
            </section>
            <section class="debt-goal-content">
                <div class="debt-content">
                    <h4>Debts</h4>
                    <p>NT$ 0</p>
                </div>
                <div class="goal-content">
                    <h4>Goals</h4>
                    <p>NT$ 0</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
